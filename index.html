<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spieleabend">
  <title>Spieleabend</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span></div>

  <header class="top">
    <div>
      <div class="top-sub" id="topSub"></div>
      <h1 id="title">Spiele</h1>
    </div>
    <button class="icon-btn accent" id="topAction" aria-label="Neues Spiel" onclick="editGame()">+</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Navigation">
    <button data-tab="games" onclick="setTab('games')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      <span>Spiele</span>
    </button>
    <button data-tab="history" onclick="setTab('history')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="stats" onclick="setTab('stats')">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Statistik</span>
    </button>
    <button data-tab="more" onclick="setTab('more')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div id="sheet" class="sheet-backdrop hidden" onclick="if(event.target===this)closeSheet()">
    <div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
